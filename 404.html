<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 — alnyx</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 400 600;
    font-display: swap;
    src: url("/fonts/inter-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 400 600;
    font-display: swap;
    src: url("/fonts/inter-cyrillic.woff2") format("woff2");
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #ffffff;
    --fg: #000000;
    --btn-bg: #000000;
    --btn-fg: #ffffff;
    --btn-hover: #383838;
    --grid: rgba(0, 0, 0, 0.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --fg: #ffffff;
      --btn-bg: #ffffff;
      --btn-fg: #000000;
      --btn-hover: #cccccc;
      --grid: rgba(255, 255, 255, 0.08);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --fg: #ffffff;
    --btn-bg: #ffffff;
    --btn-fg: #000000;
    --btn-hover: #cccccc;
    --grid: rgba(255, 255, 255, 0.08);
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background-color: var(--bg);
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: 64px 64px;
    background-position: center;
    color: var(--fg);
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(to right, color-mix(in srgb, var(--fg) 30%, transparent) 1px, transparent 1px),
      linear-gradient(to bottom, color-mix(in srgb, var(--fg) 30%, transparent) 1px, transparent 1px);
    background-size: 64px 64px;
    background-position: center;
    -webkit-mask-image: radial-gradient(220px circle at var(--mx, 50%) var(--my, 50%), #000, transparent);
    mask-image: radial-gradient(220px circle at var(--mx, 50%) var(--my, 50%), #000, transparent);
  }
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.85rem;
    padding: 2rem;
    text-align: center;
  }
  .brand {
    margin: 0;
    font-size: clamp(4rem, 18vw, 9rem);
    font-weight: 500;
    line-height: 0.9;
    letter-spacing: -0.04em;
  }
  .tagline {
    max-width: 28ch;
    margin: 0 0 0.6rem;
    font-size: 14px;
    line-height: 1.55;
    text-wrap: balance;
    color: color-mix(in srgb, var(--fg) 62%, transparent);
  }
  a.btn {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    height: 40px;
    padding: 0 1rem;
    border-radius: 6px;
    background: var(--btn-bg);
    color: var(--btn-fg);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  a.btn:hover { background: var(--btn-hover); }
  a.btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  a.btn:active { transform: scale(0.97); }
  a.btn svg {
    width: 14px; height: 14px;
    fill: none; stroke: currentColor; stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round;
  }
</style>
</head>
<body>
  <main>
    <h1 class="brand">404</h1>
    <p class="tagline">This page does not exist.</p>
    <a class="btn" href="/">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4"/></svg>
      Back home
    </a>
  </main>
  <script>
    (function () {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var root = document.documentElement;
      var tx = innerWidth / 2, ty = innerHeight / 2, x = tx, y = ty, running = false;
      function tick() {
        x += (tx - x) * 0.12; y += (ty - y) * 0.12;
        root.style.setProperty("--mx", x + "px");
        root.style.setProperty("--my", y + "px");
        if (Math.abs(tx - x) + Math.abs(ty - y) > 0.5) requestAnimationFrame(tick);
        else running = false;
      }
      addEventListener("pointermove", function (e) {
        tx = e.clientX; ty = e.clientY;
        if (!running) { running = true; requestAnimationFrame(tick); }
      });
    })();
  </script>
</body>
</html>
